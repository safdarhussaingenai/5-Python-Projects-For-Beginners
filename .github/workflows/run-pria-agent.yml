name: Run PRIA Investigator

on:
  push:
    branches:
      - pria-agent

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  investigate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run PRIA Investigator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pria-agent/pria_investigator.py

      - name: Upload PRIA evidence
        uses: actions/upload-artifact@v4
        with:
          name: pria-evidence
          path: pria-agent/pria_evidence.json
