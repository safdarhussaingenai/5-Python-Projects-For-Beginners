name: PRIA Regression Tests

on:
  push:
    branches:
      - pria-demo

  pull_request:
    branches:
      - pria-demo

jobs:
  regression-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run regression tests
        run: |
          cd pria-demo
          pytest -v
